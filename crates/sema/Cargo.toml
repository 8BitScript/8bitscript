[package]
name = "sema"
description = "Semantic analysis for the front-end port: binder, types, templates, checker"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diagnostics = { path = "../diagnostics" }
indexmap = { version = "2", features = ["serde"] }
jsnum = { path = "../jsnum" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { path = "../syntax" }
front-replay = { path = "../front-replay" }
