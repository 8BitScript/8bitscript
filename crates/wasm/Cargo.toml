[package]
name = "wasm"
description = "The wasm back end, ported from packages/compiler/src/wasm"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
jsnum = { path = "../jsnum" }
mos-ir = { path = "../mos-ir" }
sema = { path = "../sema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The later wasm units fill the modules that use serde and serde_json.
[lints.cargo]
unused_dependencies = "allow"
