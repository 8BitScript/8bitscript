[package]
name = "lexer"
description = "Lexer for the Rust-style .8bs syntax: source text in, UTF-16 spanned tokens and diagnostics out"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
syntax = { path = "../syntax" }
diagnostics = { path = "../diagnostics" }

[dev-dependencies]
serde_json = "1"
oracle = { path = "../oracle" }
