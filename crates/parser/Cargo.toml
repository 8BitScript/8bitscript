[package]
name = "parser"
description = "Parser for the Rust-style .8bs syntax: tokens in, JS-shaped AST and diagnostics out"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
syntax = { path = "../syntax" }
diagnostics = { path = "../diagnostics" }
lexer = { path = "../lexer" }

[dev-dependencies]
serde_json = "1"
oracle = { path = "../oracle" }
