[package]
name = "lower"
description = "Module lowering to IR for the front-end port"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diagnostics = { path = "../diagnostics" }
indexmap = { version = "2", features = ["serde"] }
jsnum = { path = "../jsnum" }
mos-ir = { path = "../mos-ir" }
sema = { path = "../sema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { path = "../syntax" }
front-replay = { path = "../front-replay" }
