[package]
name = "media"
description = "The .8bg and .8ba front end, ported from packages/compiler/src/media"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diagnostics = { path = "../diagnostics" }
front-replay = { path = "../front-replay" }
indexmap ={ version = "2", features = ["serde"] }
jsnum = { path = "../jsnum" }
media-tools = { path = "../media-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# indexmap and serde_json are for the audio and elaborate units that follow.
[lints.cargo]
unused_dependencies = "allow"
