[package]
name = "jsnum"
description = "JavaScript number, string and sort semantics for the port"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = "1"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
