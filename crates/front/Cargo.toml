[package]
name = "front"
description = "Front-end API tying the ported stages together"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bx = { path = "../bx" }
diagnostics = { path = "../diagnostics" }
fold = { path = "../fold" }
i18n = { path = "../i18n" }
indexmap = { version = "2", features = ["serde"] }
jsnum = { path = "../jsnum" }
lexer = { path = "../lexer" }
lower = { path = "../lower" }
parser = { path = "../parser" }
resolver = { path = "../resolver" }
sema = { path = "../sema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { path = "../syntax" }
