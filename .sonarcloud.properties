# Vestigial Automatic Analysis config. CI uses sonar-project.properties instead.
# Keep Automatic Analysis off for 8BitScript_8bitscript so ci.yml can scan
# with SONAR_TOKEN + the merged node --test lcov. While Automatic Analysis is
# enabled, sonar-project.properties is ignored and the CI scanner fails.
#
# Scope here is kept in sync with sonar-project.properties only as a safety
# net if Automatic Analysis is re-enabled by mistake.

sonar.sources=packages,editors,scripts,site
sonar.tests=packages,editors
sonar.test.inclusions=**/test/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  coverage/**,\
  **/*.prg,\
  **/*.vsix

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/test/**,\
  scripts/**,\
  site/**
