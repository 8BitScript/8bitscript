[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# front.wasm is built with --release (xtask wasm): small and without unwinding.
[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"
