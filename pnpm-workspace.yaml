# The monorepo. Every publishable package lives in packages/ — the
# toolchain, the machine and capability packages, and the apps that ship
# with them.
#
# Editor integrations live in editors/. They are workspace members because the
# editor client has npm dependencies of its own; nothing there is published to
# npm.
#
# Outside this repository, programs install `@8bitscript/cli` from npm at the
# same version the workspace publishes.
packages:
  - packages/*
  - editors/*

# pnpm blocks dependency install scripts unless they are approved here.
# workerd and esbuild belong to wrangler: workerd is the Workers runtime used
# by `wrangler dev`, and esbuild is its bundler. Their postinstall scripts
# unpack the platform binaries, so without this the docs preview server
# cannot start. vsce-sign and keytar belong to @vscode/vsce: vsce-sign
# unpacks the native binary it uses to sign/verify .vsix packages, and keytar
# unpacks the native module `vsce login` uses to store a PAT in the OS
# keychain.
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  workerd: true
