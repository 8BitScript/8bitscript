# Accepted differences between the JS oracle and the Rust port, one entry each:
#
# [[divergence]]
# id = "D001"                   # unique, never reused
# corpus = "vegas-nights/*/c64" # glob on the corpus id
# stage = "link"                # stage id
# pointer = "/symbols/*"        # glob on the locator of the ERROR line (default "*")
# reason = "..."                # required, at least 20 characters: why the difference is correct
# issue = 123                   # optional GitHub issue number

# media: R7.6: media/machine (structural note): the JS `diagnostic` callback and `helpers` object passed to lowerGraphics/lowerAudio become direct Diagnostic construction and an `encode_song` function argument; Frame and Pcm are placeholders until the decoders are ported.
# media: R7.6: machines::{c64,cx16,vic20} lower_audio: JS reads `WAVE[fallback] ?? 1` on a plain object, so a synth named like an Object.prototype member ("constructor") would put a function in `data`; Rust maps unknown names to 1. Unreachable: the only caller of lowerAudio is elaborateMedia, whose `fallback.synth` comes from parseAudio, which accepts only pulse, noise, triangle and saw (else the default "noise").
# media: R7.8: machines/pet voices_of: `Number(facts['audio.voices'])` of an array or object (`Number([5])` is 5) gives NaN here, so the module takes the no-voice path. Unreachable: the only caller passes the machine facts, whose `audio.voices` is a number.
# media: R7.6: machines/{atari8,nes,pet,web} (fixtures only): `gen/machine-media.mjs <machine>` records JS results; frames are replayed as `Frame {width, height, rgba}` (the decoder output), and a missing byte of a short `rgba` reads as JS `undefined` in every comparison the JS makes.
# media: R7.6: machines/web (fixtures only): the graphics half is the pixel-sprite lowering of #419; replayed from gen/machine-media.mjs web with the web and cx16 facts.
# media: R7.8: machines/web lower_graphics: a video.spriteWidth/spriteHeight/spriteKib fact that is NaN: Rust f64::max/min drop the NaN where Math.max/min keep it, so `kept` becomes 0 and the tally stays `at`; a NaN window keeps 1 frame and warns where JS keeps all and does not warn, and a NaN pool warns where JS does not. Unreachable: the only caller is the elaborate step of the media pipeline, which passes the build facts read from package.json numbers.
# media: R7.6: elaborate sprite_bounds (fixtures only): replayed from gen/media-bounds.mjs; the bounds call itself is emitted by the elaborate unit.
# media: R7.6: elaborate load_machine_media: a third-party machine package whose "8bitscript".media module is not one of the seven in `media::machines` gets default lowering in Rust; JS runs its module. No corpus module is affected.
# media: R2.1: elaborate ints/data_global and the meta args of bind (elaborate.rs 211-214, 636-642): a lowered data byte, frames, every, kind, width or height that JS holds as an f64 becomes an IR integer with a saturating `as i64` (NaN to 0); a value that is not whole or is outside the i64 range is written differently. Reachable only with a machine media module that returns such a number; no corpus module does.
# media: R7.8: lower_default wave_index (lower_default.rs 5-8): JS looks the name up in a plain object, so a name such as `constructor` finds an inherited member and puts a function in the byte list; Rust answers WAVE_PULSE for any name that is not one of the four. Callers: none in production, since nes and atari8 use their own songEvents; the checker has validated the waveform of every instrument that reaches default lowering.
# media: R7.8: elaborate decode_sprite_source (elaborate.rs 14, 432): a sprite width or height that is not a whole number or is negative is cut by `as usize` (saturating, NaN to 0) where JS passes the float on to sliceFrames. Reachable: finishModule (linker/index.mjs:93) runs elaborateMedia even after the checker has reported errors, and the checker is what refuses such a size.
# media: R7.10: elaborate io_message (elaborate.rs 363-372): a file that cannot be read gives Node's text for EISDIR and EACCES only; other errno values (ENOENT, ELOOP, ...) get Rust's io error text, which differs.
# media: R7.1: elaborate decode_sprite_source js_u32(size_length) (elaborate.rs 427): a negative size length is clamped to 0 (and a length above u32::MAX to u32::MAX) where JS keeps the number; the diagnostic span is the only consumer.
# fold: R7.7: package::nearest_package: the error text of a package.json that fails JSON.parse is approximate ("Unexpected token X in JSON at position N"); V8's wording differs by Node version.
# fold: R7.10: package::nearest_package: a package.json that cannot be read gives Node's text for ENOENT, EACCES and EISDIR; other errno values get Rust's io error text.
# fold: R7.8: facts::fact_const_name: an empty first word (key "" or ".x") makes JS throw on `group[0].toUpperCase()`; the port returns an empty namespace. Unreachable: the only caller passes FACTS keys.
# fold: R7.2: package::nearest_package: a lone surrogate escape in package.json ("\ud800") becomes U+FFFD, not a lone code unit.
# bx: R7.8: elaborate::transform_statement: an if/while/for body or else branch that elaborates to no statement leaves the JS key undefined (JSON.stringify drops it); Rust writes null (consequent, alternate and the loop bodies are R3.3 fields). Unreachable: the parser gives these bodies only as a BlockStatement (or null after an error), and a block always elaborates to one statement.
# bx: R6.2: elaborate::component_function (hoisted methods): JS builds a hoisted method as { ...method, name, body, exported, component, owner, method, state }, so a decorated method's JSON has decorators before component, owner, method and state; Rust writes decorators last (syntax::Node). Key order only: the walk visits the same nodes in the same order (component, owner, method and state are not nodes), and no stage dumps the AST after elaboration.
# fold: R7.8: DefineValue::from_json (a defines value handed to fold_compile_time or define_kind): a value that is not a bool, number or string (null, an array, an object) has kind string in JS, which folds the #define to a StringLiteral whose value is that value itself (null in JSON) and quotes it with JSON.stringify in DEFINE_TYPE_MISMATCH (null); Rust holds it as a string of its JSON text, so the value is "null" and the message says `null`. Unreachable: defines come from --define NAME=VALUE and a program's define block (cli/src/defines.mjs, typed Record<string, number|boolean|string>).
# fold: R7.8: replace_with_fact (a #fact value from the hardware sheet that is neither a bool nor a number: a string, null, an array or an object): JS folds the #fact call to a literal that holds that value as it is; Rust folds it to an IntegerLiteral 0 with raw #fact(key), because the Rust literal holds an f64. Unreachable from a program or config: facts come only from the in-repo machine catalogs through resolveHardware, whose sheets hold numbers and flags, and the linker passes them through (linker/index.mjs); only a third-party link() or foldCompileTime caller with a wrongly typed sheet sees it.
# i18n: R7.10: fs (readFileSync of a catalog file, thrown out of prepare_catalog): a file that cannot be read gives Node's text for ENOENT, EACCES and EISDIR; other errno values get approximate text.
# i18n: R7.2: string arguments (tap replay): a lone surrogate escape ("\ud800") becomes U+FFFD, not a lone code unit. Files read from disk cannot carry one (invalid UTF-8 becomes U+FFFD in Node too).
# lower: R7.8: Lowering::namespace_declaration: a namespace member VariableDeclaration whose name is null is reported by JS (let, or a type that is not compilable) or throws at member.name.name (a compilable const); Rust skips it with no diagnostic. Unreachable: the parser builds a namespace member's VariableDeclaration only with a name (parse_variable_named returns None without one).
# lower: R2.1: module::int: a JS number becomes an IR integer with a saturating as i64 (NaN to 0); JS keeps the f64, so a value that is not whole or is outside the i64 range is written differently. Reachable with an out-of-range literal: the IR value saturates, and the VALUE_OUT_OF_RANGE message prints the JS number, so it matches the JS.
# mos: R2.1: machine::chrget_zp_holes (machine.rs 196-197): the hole's start and end come from a JS number (`memory.chrget` and `chrget + 24`); the IR integer is a saturating `as i64` (NaN to 0), so a chrget that is not whole or is outside the i64 range gives a different hole. Reachable only with a machine sheet that sets such a `memory.chrget`; none in the corpus does (the guard against the zero-page budget has already run on the f64).
# sema: R7.8: checker::check: a root that is not a Program makes JS throw in checkFunctions (ast.body.filter) before any rule runs, and a root with an array body (a BlockStatement) is checked as if it were the top level; Rust returns no diagnostics for any root that is not a Program. Unreachable: both callers, finishModule (linker/index.mjs:109) and analyze (compiler/index.mjs:138), pass the parser's Program.
# media-tools: R7.3: png::decode_png (zlib data error): miniz_oxide reports one generic failure for a bad deflate body, so the message is the fixed "invalid block type"; the header, checksum and truncation messages match Node exactly.
# media-tools: R7.6: audio::resolve_ffmpeg (fixtures only, no corpus stage): compiled out on wasm32, where ffmpeg_available is false and the PATH search is unused.
# jsnum: R7.8: parse_int with a radix other than 2, 4, 8, 10, 16 or 32: V8 accumulates in uint32 chunks and the f64 fold here can differ in the last bits on long inputs. Unreachable: the callers (mos chr_nes.rs, asm/parse.rs, native.rs, asm/relax.rs) pass radix 2, 10 or 16 only.
# resolver: R7.8: tap native_sources_beside: a file that is not a string makes JS `dirname` throw; the replay skips it. Unreachable: the only caller, linker/index.mjs:164, passes the entry file path string.
#
# front: R1.10/R0.4: crates/front/src/module.rs finish_module pre_elaboration: a definer that
#   finishes before a module that imports it is shown to that module's `elaborateBx` by its
#   JS tree after its own elaboration and fold, so a shared default value is already fold-
#   rewritten there; Rust keeps the pre-elaboration snapshot (R1.10) and sees the unrewritten
#   value. No corpus module reaches it (the `module-ir` compare is clean over 20918 files);
#   a fix needs the finished tree kept per module beside the snapshot.
#
# linker has no corpus stage yet, so its accepted differences are comment lines (a
# [[divergence]] table that matches nothing is STALE):
# linker: R7.8: crates/linker/src/lib.rs ConstValue::Number: a const value is an f64 and a JS number is kept as is; the saturating `as i64` of R2.1 applies only where a value becomes an IR constant.
# linker: R7.8: crates/linker/src/lib.rs ir_of: a module with no entry in the graph's IR reads as an empty module IR; JS would throw on the missing object.
# linker: R7.8: crates/linker/src/consts.rs const values: an Absent or Null const value reads as 0, where JS reads undefined or null and coerces it in arithmetic.
# linker: R7.8: crates/linker/src/consts.rs check_initialiser: a type that is neither bool nor an integer type makes JS throw on `range.min` (resolveIntegerType returns undefined); Rust returns 0.0 and reports nothing. Unreachable: the callers are resolve_pending_consts (index.mjs:537) and, in the unported link step, the parameter defaults (:1322) and the global initializers (:1338, :1340); all pass a type lowering recorded, and lowering (ir/index.mjs:395-415 for a global, :462-482 for a const, :718-735 for a parameter default) accepts only an integer type or bool there. A string const or a string parameter default takes its own path (a string slot, never a pending expression) and never reaches resolveInitialiser. None of the link-step callers is ported yet, so none reaches this function.
# linker: R7.8: crates/linker/src/consts.rs const_expression: a pending value returns None; JS returns `{ kind: 'string', index: undefined }` (typeof of the pending object is 'object'). Unreachable: the only caller that can see a pending value would be the rewrite pass (index.mjs:761, :900), and resolve_pending_consts has settled every pending const to a number before any module is rewritten.
# linker: R7.8: crates/linker/src/consts.rs complete_call: a parameter with no default past the supplied arguments is not pushed (JS pushes `structuredClone(undefined)`). Unreachable: the callers are the rewrite pass's call sites (index.mjs:851, :887, :1066), and lowering refuses a parameter without a default after one with a default (ir/index.mjs:815, :836), so every parameter past `min` has a default; a call with fewer than `min` arguments takes the arity-error return first.
# linker: R7.8: crates/linker/src/consts.rs consts_of: a string const with no `string` slot reads as slot 0; JS passes `{ string: undefined }`. Unreachable: lowering writes `string: slot.index` for every const of type string (ir/index.mjs:521), and consts_of is called only from bind_imports on a module IR that lowering produced.
# linker: R7.8: crates/linker/src/consts.rs check_string_fits: a string index outside the table is skipped; JS would read undefined.
# optimize: R2.1: fold_call, fold_expr and eval_expr (call arguments) (`evaluated as i64`, `value as i64`): an evaluated number that JS keeps as an f64 becomes an IR integer with a saturating `as i64`, so NaN becomes 0 and a fraction is cut; `1 << -1` on an unsigned type folds to 0.5 in JS and to 0 here. Reachable only through a folded constant expression the corpus does not contain; the linked-ir compare is the check once the stage is wired.
# optimize: R7.8: fold_stmt, the `for` arm: an init that folds to an expression instead of a statement is kept as it was; JS replaces it. Callers: optimizeBody and optimizeStatement. Unreachable: foldExpr turns only a call statement into an expression, and no `for` init is a call statement.
# optimize: R2.1: fold_expr (StringByte) and eval_expr (StringByte), the `index.fract() == 0.0` guard: JS reads `bytes[1.5]` as undefined and folds the node anyway; Rust leaves a fractional index unfolded and gives no value. Reachable only when the index folds to a fraction, such as `1 << -1` (the same f64 case as above); no corpus program has one.
# optimize: R7.8: site_body: a callee that is not void and has no final return statement, or a call with fewer arguments than the callee has parameters, makes JS throw or read undefined; Rust returns None. Unreachable: site_body has three callers, hoistValueCall (optimize.mjs:1088, through findValueCall and singleCallerCallee(call, ctx, true) at :1039), inlineSingleCaller (:1123, from optimizeStatement :1286 after singleCallerCallee(call, ctx, false)) and optimizeStatement (:1293 after singleCallerCallee(call, ctx, true) at :1291); singleCallerCallee returns null unless the argument count equals the parameter count (:906) and, for a value callee, unless the body ends in a return with a value (:910-:913), and a void callee has no value to read.
# optimize: R7.8: writes_of (stringCopy): the target is counted as written only when it is a ref; JS reads `target.name`, which is undefined for any other node and adds nothing. Same result, no panic. Unreachable: writes_of has two callers, siteBody (optimize.mjs:979) and restIsInert (:1054), both passing a callee body taken from the linked function list; no linked stringCopy has a target that is not a ref (the 393 writesOf fixture rows over synthetic and corpus programs match).
