# Accepted differences between the JS oracle and the Rust port, one entry each:
#
# [[divergence]]
# id = "D001"                   # unique, never reused
# corpus = "vegas-nights/*/c64" # glob on the corpus id
# stage = "link"                # stage id
# pointer = "/symbols/*"        # glob on the locator of the ERROR line (default "*")
# reason = "..."                # required, at least 20 characters: why the difference is correct
# issue = 123                   # optional GitHub issue number

# media: R7.5: audio/parse parseOrder: JS never advances past a token that is not a name or ',' (`order { 5 }`) and loops forever (the diagnostic list grows without bound); Rust stops reading the order at the first such token and goes on to the closing brace.
# media: R7.6: media/machine (structural note): the JS `diagnostic` callback and `helpers` object passed to lowerGraphics/lowerAudio become direct Diagnostic construction and an `encode_song` function argument; Frame and Pcm are placeholders until the decoders are ported.
# media: R7.6: machines::{c64,cx16,vic20} lower_audio: JS reads `WAVE[fallback] ?? 1` on a plain object, so a synth named like an Object.prototype member ("constructor") would put a function in `data`; Rust maps unknown names to 1. Unreachable: the only caller of lowerAudio is elaborateMedia, whose `fallback.synth` comes from parseAudio, which accepts only pulse, noise, triangle and saw (else the default "noise").
# media: R7.8: machines/pet voices_of: `Number(facts['audio.voices'])` of an array or object (`Number([5])` is 5) gives NaN here, so the module takes the no-voice path. Unreachable: the only caller passes the machine facts, whose `audio.voices` is a number.
# media: R7.6: machines/{atari8,nes,pet,web} (fixtures only): `gen/machine-media.mjs <machine>` records JS results; frames are replayed as `Frame {width, height, rgba}` (the decoder output), and a missing byte of a short `rgba` reads as JS `undefined` in every comparison the JS makes.
# fold: R7.3: package::nearest_package: the error text of a package.json that fails JSON.parse is approximate ("Unexpected token X in JSON at position N"); V8's wording differs by Node version. A file that cannot be read gives Node's text for ENOENT, EACCES and EISDIR.
# fold: R7.8: facts::fact_const_name: an empty first word (key "" or ".x") makes JS throw on `group[0].toUpperCase()`; the port returns an empty namespace. Unreachable: the only caller passes FACTS keys.
# fold: R7.2: package::nearest_package: a lone surrogate escape in package.json ("\ud800") becomes U+FFFD, not a lone code unit.
# bx: R7.8: elaborate::transform_statement: an if/while/for body or else branch that elaborates to no statement leaves the JS key undefined (JSON.stringify drops it); Rust writes null (consequent, alternate and the loop bodies are R3.3 fields). Unreachable: the parser gives these bodies only as a BlockStatement (or null after an error), and a block always elaborates to one statement.
# bx: R6.2: elaborate::component_function (hoisted methods): JS builds a hoisted method as { ...method, name, body, exported, component, owner, method, state }, so a decorated method's JSON has decorators before component, owner, method and state; Rust writes decorators last (syntax::Node). Key order only: the walk visits the same nodes in the same order (component, owner, method and state are not nodes), and no stage dumps the AST after elaboration.
# fold: R7.8: DefineValue::from_json (a defines value handed to fold_compile_time or define_kind): a value that is not a bool, number or string (null, an array, an object) has kind string in JS, which folds the #define to a StringLiteral whose value is that value itself (null in JSON) and quotes it with JSON.stringify in DEFINE_TYPE_MISMATCH (null); Rust holds it as a string of its JSON text, so the value is "null" and the message says "\"null\"". Unreachable: defines come from --define NAME=VALUE and a program's define block (cli/src/defines.mjs, typed Record<string, number|boolean|string>).
# media-tools (P3-21) has no corpus stage, so it has no [[divergence]] table
# (an entry that matches nothing is STALE). Its accepted differences are
# listed in the crate docs, `crates/media-tools/src/lib.rs`:
#   - miniz_oxide gives approximate zlib error text for deflate data errors;
#     header, checksum and truncation messages are exact.
#   - decode_flac returns an error struct { message, code } so that the
#     FLAC_NEEDS_FFMPEG code survives.
#   - a WAV with zero channels is an error, and slice_frames with a frame
#     size of 0 returns no frames; accepted: JS does not terminate.
