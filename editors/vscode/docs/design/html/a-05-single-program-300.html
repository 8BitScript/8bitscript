<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Direction A — launch card · 05-single-program · 300px</title>
<script>document.write('<link rel="stylesheet" href="../themes/' + (new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark') + '-modern.css">');</script>
<link rel="stylesheet" href="../src/design.css">
<style>:root { --w: 300px; }</style></head>
<body><div class="sidebar" id="sb">
  <div class="vsc-title"><span>8BitScript</span><span class="acts"><i class="codicon" aria-hidden="true">&#60215;</i><i class="codicon" aria-hidden="true">&#60209;</i><i class="codicon" aria-hidden="true">&#60028;</i></span></div>
  <main class="view"><div class="project">
    <img src="../../../media/8bitscript-icon.svg" alt="">
    <div class="who"><div class="name">2048</div><div class="sub">2048 · @8bitscript/cli 0.24.0</div></div>
    <button class="ibtn" title="Project details" aria-label="Project details"><i class="codicon" aria-hidden="true">&#60020;</i></button>
  </div><div style="height:8px"></div><section class="card" aria-label="2048 launcher">
    <div class="part"><p class="desc first">The sliding-tile puzzle, one source tree for five machines.</p>
      <button class="source" title="Open the entry file of 2048" aria-label="Open source file src/2048.8bs"><i class="codicon" aria-hidden="true">&#60052;</i><span>src/2048.8bs</span></button></div>
    <div class="part"><div class="field-head"><span class="field-label" id="sl">System</span>
    <button class="btn ghost sm" data-toggle="sysopts" aria-expanded="false" aria-controls="sysopts" title="Hardware, region and language for this run"><i class="codicon" aria-hidden="true">&#60241;</i>Options</button></div><div class="chips" role="radiogroup" aria-label="System" id="sys-chips"><button class="chip" role="radio" aria-checked="false" tabindex="-1"  title="Commodore PET · 4032 · 32 KB" data-system="pet">PET</button><button class="chip" role="radio" aria-checked="true" tabindex="0"  title="Commodore VIC-20 · 8 KB expansion" data-system="vic20">VIC-20</button><button class="chip" role="radio" aria-checked="false" tabindex="-1"  title="Commodore 64 · 64 KB" data-system="c64">C64</button><button class="chip" role="radio" aria-checked="false" tabindex="-1"  title="Commander X16 · 512 KB banked" data-system="cx16">X16</button><button class="chip" role="radio" aria-checked="false" tabindex="-1"  title="Web · browser runtime" data-system="web">Web</button></div><div class="summary"><b>Commodore VIC-20</b> · 8 KB expansion · NTSC · English</div><div class="panel form" id="sysopts" hidden>
    <div><label class="f-label" for="sysopts-hw"><span>Hardware</span><span class="var">--hardware</span></label><div class="select-wrap"><select class="select" id="sysopts-hw"><option>8 KB expansion</option><option>16 KB expansion</option><option>3 KB expansion</option></select><i class="codicon" aria-hidden="true">&#60084;</i></div></div>
    <div><span class="f-label"><span>Region</span><span class="var">--pal</span></span><div class="seg" role="radiogroup" aria-label="Region"><button role="radio" aria-checked="true">NTSC</button><button role="radio" aria-checked="false">PAL</button></div></div>
    <div><label class="f-label" for="sysopts-lang"><span>Language</span><span class="var">--locale</span></label><div class="select-wrap"><select class="select" id="sysopts-lang"><option>English</option><option>Deutsch</option><option>Français</option></select><i class="codicon" aria-hidden="true">&#60084;</i></div></div>
    <div><button class="btn sm"><i class="codicon" aria-hidden="true">&#60000;</i>Save as a named system…</button></div>
  </div></div>
    
    <div class="part"><span class="field-label" id="rl">Run in</span><div class="runs" role="group" aria-label="Run in"><button class="btn run primary" data-runtime="editor" data-hint="Runs the WASM build in a tab inside the editor."  title="Run 2048 on Commodore VIC-20 in editor tab (default)" aria-label="Run 2048 on Commodore VIC-20 in editor tab (default)"><i class="codicon" aria-hidden="true">&#60200;</i><span>Editor</span></button><button class="btn run" data-runtime="browser" data-hint="Runs the WASM build in your web browser."  title="Run 2048 on Commodore VIC-20 in web browser" aria-label="Run 2048 on Commodore VIC-20 in web browser"><i class="codicon" aria-hidden="true">&#60161;</i><span>Browser</span></button><button class="btn run" data-runtime="native" data-hint="Runs the real xvic emulator with 2048 loaded."  title="Run 2048 on Commodore VIC-20 in native emulator" aria-label="Run 2048 on Commodore VIC-20 in native emulator"><i class="codicon" aria-hidden="true">&#60026;</i><span>Native</span></button></div><p class="hint" id="hint" aria-live="polite">Runs the WASM build in a tab inside the editor.</p>
      <div class="tools-row">
    <button class="btn ghost sm" title="Compile main to dist/main.prg and show the size report. Nothing runs."><i class="codicon" aria-hidden="true">&#60269;</i>Build</button>
    <button class="btn ghost sm" data-toggle="cmd" aria-expanded="false" aria-controls="cmd" title="Show the exact command a click runs"><i class="codicon" aria-hidden="true">&#60037;</i>Command</button>
    <span class="grow"></span>
    <button class="ibtn" title="More: open a bare emulator, copy the command, reveal in Explorer" aria-label="More actions" aria-haspopup="menu"><i class="codicon" aria-hidden="true">&#60028;</i></button></div><div class="panel" id="cmd" hidden><div class="code"><span class="cmd"><span class="nb">8bs run vic20</span> <span class="nb">--web</span> <span class="nb">--no-open</span> <span class="nb">--port 0</span></span><button class="ibtn" title="Copy command" aria-label="Copy command"><i class="codicon" aria-hidden="true">&#60364;</i></button></div></div></div>
  </section><div class="sec"><span>Tools</span><span class="grow"></span></div><div class="rows"><button class="row-btn"><i class="codicon" aria-hidden="true">&#60228;</i><span class="who"><div>Studio</div><div class="sub">Edit sprites, sound and tiles</div></span><i class="codicon" aria-hidden="true">&#60086;</i></button><button class="row-btn"><i class="codicon" aria-hidden="true">&#60209;</i><span class="who"><div>Doctor</div><div class="sub">Check the toolchains and emulators</div></span><i class="codicon" aria-hidden="true">&#60086;</i></button><button class="row-btn"><i class="codicon" aria-hidden="true">&#60020;</i><span class="who"><div>Project details</div><div class="sub">Config, packages, systems</div></span><i class="codicon" aria-hidden="true">&#60086;</i></button></div></main>
</div>
<script>
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle]');
  const el = t && document.getElementById(t.dataset.toggle);
  if (el) { const open = el.hasAttribute('hidden'); el.toggleAttribute('hidden', !open); t.setAttribute('aria-expanded', String(open)); }
  const r = e.target.closest('[role=radio]:not([disabled])');
  if (r) { r.parentElement.querySelectorAll('[role=radio]').forEach((x) => { x.setAttribute('aria-checked', String(x === r)); x.tabIndex = x === r ? 0 : -1; }); }
});
const hint = document.getElementById('hint');
document.querySelectorAll('[data-hint]').forEach((b) => {
  const set = () => { if (hint) hint.textContent = b.dataset.hint; };
  b.addEventListener('mouseenter', set); b.addEventListener('focus', set);
});
document.fonts.ready.then(() => { document.body.dataset.h = Math.ceil(document.getElementById('sb').getBoundingClientRect().height); });
</script></body></html>
