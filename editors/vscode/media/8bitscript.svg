<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="8BitScript">
  <!--
    The pixel "8" from docs/assets/favicon.svg, without its background square.
    The editor paints Activity Bar icons as a single-colour mask, so only the
    shape matters: with the square left in, the whole tile would be solid.
  -->
  <g fill="#000">
    <rect x="10" y="4" width="4" height="4"/>
    <rect x="14" y="4" width="4" height="4"/>
    <rect x="18" y="4" width="4" height="4"/>

    <rect x="6" y="8" width="4" height="4"/>
    <rect x="22" y="8" width="4" height="4"/>

    <rect x="10" y="12" width="4" height="4"/>
    <rect x="14" y="12" width="4" height="4"/>
    <rect x="18" y="12" width="4" height="4"/>

    <rect x="6" y="16" width="4" height="4"/>
    <rect x="22" y="16" width="4" height="4"/>

    <rect x="6" y="20" width="4" height="4"/>
    <rect x="22" y="20" width="4" height="4"/>

    <rect x="10" y="24" width="4" height="4"/>
    <rect x="14" y="24" width="4" height="4"/>
    <rect x="18" y="24" width="4" height="4"/>
  </g>
</svg>
