sonar.projectKey=8BitScript_8bitscript
sonar.projectName=8bitscript
sonar.organization=8bitscript

# CI-based analysis via .github/workflows/ci.yml (SONAR_TOKEN). Automatic
# Analysis must stay off for this project (SonarCloud → Administration →
# Analysis Method); otherwise the CI scanner fails. The key matches the
# GitHub-bound SonarCloud project — not a lowercase rename.

# node --test lcov from `pnpm run test:coverage` (scripts/test-coverage.mjs).
# That script runs every workspace package's tests under
# --experimental-test-coverage and merges the per-package coverage/lcov.info
# files into one repo-relative coverage/lcov.info.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Two test conventions live side by side: packages/*/test/** (most
# packages) and files named *.test.ts co-located next to the source they
# cover (packages/compiler/src/mos/**, e.g. lower/allocator.test.ts —
# established at milestone 4, ten files as of milestone 8). Both need
# naming here, or a co-located file counts as *source* Sonar found no test
# for — which is what actually happened on milestone 8's own PR: two
# co-located test files (135 new lines between them) counted as uncovered
# source and alone dropped "Coverage on New Code" from a real ~93% to
# 63.2%, a false gate failure on a PR that added real, passing tests.
sonar.sources=packages,editors,scripts,site
sonar.tests=packages,editors
sonar.test.inclusions=**/test/**,**/*.test.ts,**/*.test.mjs

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  coverage/**,\
  **/*.prg,\
  **/*.vsix

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/test/**,\
  **/*.test.ts,\
  **/*.test.mjs,\
  scripts/**,\
  site/**

# The controller mapping page is deliberately duplicated. An installed
# @8bitscript/cli cannot reach editors/vscode (it is private and outside
# packages/), so the page, its stylesheet and the three profile modules are
# mirrored into packages/cli/src/controller-page/ — byte-for-byte, with a
# test that fails and prints the `cp` that fixes any drift. Copy detection
# reports that mirror at 95-97% and fails the gate on a duplication the
# repository is choosing and enforcing. Excluding the copy is enough:
# CPD scores a pair, so the editor-side originals come back to 0 with it.
sonar.cpd.exclusions=packages/cli/src/controller-page/**
