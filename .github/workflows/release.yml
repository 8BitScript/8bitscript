name: Release

on:
  push:
    tags: ['v*']
  # tag-release.yml pushes the tag with the default GITHUB_TOKEN, which
  # doesn't fire the `push: tags` trigger above (GitHub suppresses
  # workflow runs another workflow's GITHUB_TOKEN triggers, to prevent
  # loops) — it dispatches this explicitly instead. Manual dispatch also
  # works for recovering a failed release, including from trunk after a
  # packaging fix: `gh workflow run release.yml --ref trunk`. npm skips
  # versions already on the registry; the GitHub Release title comes from
  # packages/cli/package.json, not the git ref name.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
      - run: node scripts/release.mjs --allow-dirty
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Separate from npm: a trunk recovery checkout has no tags (v0.6.2,
  # run 34766752093), and a 403 on this push used to fail npm and skip
  # every store that `needs: npm`. Pinning after publish keeps those
  # independent. fetch-tags is required on a depth-1 clone; the script
  # also fetches the one tag it needs if checkout did not.
  pin-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      # package-manager-cache defaults to true and then demands pnpm because
      # package.json names it — this job only runs node and git (v0.6.2's
      # recovery died here: "Unable to locate executable file: pnpm").
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/release.mjs --pin-release

  extension:
    needs: npm
    runs-on: ubuntu-latest
    # The `marketplace` environment holds AZURE_CLIENT_ID / AZURE_TENANT_ID
    # and is the subject the Entra federated credential trusts
    # (repo:8BitScript/8bitscript:environment:marketplace). This job only
    # reads the repo; id-token lets azure/login exchange the OIDC token.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package once so retries do not rebuild. Both marketplaces' publish
      # APIs are flaky (v0.1.1 hit a 180s "Request timeout: /_apis/gallery"
      # from vsce on a GitHub-hosted runner, not just from a home network).
      # Publish each store independently so a Marketplace timeout does not
      # skip Open VSX. --skip-duplicate covers a "timed out" request that
      # actually succeeded server-side.
      - name: Package VSIX
        working-directory: editors/vscode
        run: pnpm exec vsce package --out /tmp/8bitscript.vsix
      # v0.8.0: three attempts 30s apart (~2 minutes of retrying) still lost
      # to a live Azure DevOps Services outage on the gallery backend
      # (`/_apis/gallery` returning 503 "Sorry! Our services aren't
      # available right now" on every attempt). Six attempts a minute apart
      # gives ~5 minutes of retrying, which comfortably outlasts the
      # multi-minute outages this endpoint is known for — see the WAIT_MS
      # comment in publish-marketplace.mjs.
      # Preferred sign-in: Microsoft Entra through GitHub OIDC and a
      # user-assigned managed identity. Skipped until the owner sets the
      # AZURE_CLIENT_ID variable on the `marketplace` environment. It must
      # not stop the other stores: if it fails, the publish below falls back
      # to VSCE_PAT when that is set, and Open VSX is unaffected.
      - name: Sign in to Azure
        id: azlogin
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource.
      # An Entra token expires, and one attempt can wait many minutes on the
      # gallery, so each attempt fetches a fresh token. If the fetch fails
      # the attempt uses VSCE_PAT when set.
      - name: Publish to Visual Studio Marketplace
        id: vsce
        if: ${{ env.VSCE_PAT != '' || steps.azlogin.outcome == 'success' }}
        continue-on-error: true
        env:
          AZURE_LOGIN_OUTCOME: ${{ steps.azlogin.outcome }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            token=""
            if [ "$AZURE_LOGIN_OUTCOME" = success ]; then
              token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv) || token=""
              if [ -n "$token" ]; then
                echo "::add-mask::$token"
              elif [ -n "$VSCE_PAT" ]; then
                echo "Could not get an Entra token; using VSCE_PAT for this attempt."
              else
                echo "Could not get an Entra token and VSCE_PAT is not set."
              fi
            else
              echo "Azure sign-in unavailable; using VSCE_PAT."
            fi
            if [ -n "$token" ]; then
              VSCE_AAD_TOKEN="$token" node scripts/publish-marketplace.mjs /tmp/8bitscript.vsix && exit 0
            elif [ -n "$VSCE_PAT" ]; then
              node scripts/publish-marketplace.mjs /tmp/8bitscript.vsix && exit 0
            fi
            [ "$attempt" = 6 ] && exit 1
            echo "Marketplace publish failed (attempt $attempt/6), retrying in 60s..."
            sleep 60
          done
      - name: Publish to Open VSX
        id: ovsx
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: editors/vscode
        run: |
          for attempt in 1 2 3 4 5 6; do
            pnpm exec ovsx publish /tmp/8bitscript.vsix -p "$OVSX_PAT" --skip-duplicate && exit 0
            [ "$attempt" = 6 ] && exit 1
            echo "ovsx publish failed (attempt $attempt/6), retrying in 60s..."
            sleep 60
          done
      - name: Fail if a marketplace publish failed
        if: always()
        env:
          VSCE_OUTCOME: ${{ steps.vsce.outcome }}
          AZURE_CONFIGURED: ${{ vars.AZURE_CLIENT_ID != '' }}
          OVSX_OUTCOME: ${{ steps.ovsx.outcome }}
        run: |
          failed=0
          if { [ "$AZURE_CONFIGURED" = true ] || [ -n "$VSCE_PAT" ]; } && [ "$VSCE_OUTCOME" != "success" ]; then
            echo "Visual Studio Marketplace publish did not succeed ($VSCE_OUTCOME)"
            failed=1
          fi
          if [ -n "$OVSX_PAT" ] && [ "$OVSX_OUTCOME" != "success" ]; then
            echo "Open VSX publish did not succeed ($OVSX_OUTCOME)"
            failed=1
          fi
          exit "$failed"

  docs:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build

  github-release:
    needs: [npm, extension, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Extract this version's changelog entry
        run: |
          version="${TAG#v}"
          awk -v ver="## $version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' packages/cli/CHANGELOG.md > /tmp/release-notes.md
        env:
          TAG: ${{ steps.ver.outputs.tag }}
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
