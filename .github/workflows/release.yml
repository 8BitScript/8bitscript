name: Release

on:
  push:
    tags: ['v*']
  # tag-release.yml pushes the tag with the default GITHUB_TOKEN, which
  # doesn't fire the `push: tags` trigger above (GitHub suppresses
  # workflow runs another workflow's GITHUB_TOKEN triggers, to prevent
  # loops) — it dispatches this explicitly instead. Manual dispatch also
  # works for recovering a failed release: `gh workflow run release.yml
  # --ref vX.Y.Z`.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-llvm-mos
      - run: pnpm run test:ci
      - run: node scripts/release.mjs --allow-dirty
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    needs: npm
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both marketplaces' publish APIs are occasionally flaky (v0.1.1 hit
      # a "Request timeout: /_apis/gallery" from vsce on a GitHub-hosted
      # runner, not just from a home network) — retry a few times before
      # giving up. --skip-duplicate covers the case where a "timed out"
      # request actually succeeded server-side.
      - if: ${{ env.VSCE_PAT != '' }}
        run: |
          for attempt in 1 2 3; do
            pnpm exec vsce publish --skip-duplicate && break
            [ "$attempt" = 3 ] && exit 1
            echo "vsce publish failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
        working-directory: editors/vscode
      - if: ${{ env.OVSX_PAT != '' }}
        run: |
          for attempt in 1 2 3; do
            pnpm exec ovsx publish -p "$OVSX_PAT" --skip-duplicate && break
            [ "$attempt" = 3 ] && exit 1
            echo "ovsx publish failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
          done
        working-directory: editors/vscode

  docs:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build

  github-release:
    needs: [npm, extension, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## $version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' packages/cli/CHANGELOG.md > /tmp/release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
