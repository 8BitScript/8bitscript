name: Release

on:
  push:
    tags: ['v*']
  # tag-release.yml pushes the tag with the default GITHUB_TOKEN, which
  # doesn't fire the `push: tags` trigger above (GitHub suppresses
  # workflow runs another workflow's GITHUB_TOKEN triggers, to prevent
  # loops) — it dispatches this explicitly instead. Manual dispatch also
  # works for recovering a failed release, including from trunk after a
  # packaging fix: `gh workflow run release.yml --ref trunk`. npm skips
  # versions already on the registry; the GitHub Release title comes from
  # packages/cli/package.json, not the git ref name.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-llvm-mos
      - run: pnpm run test:ci
      - run: node scripts/release.mjs --allow-dirty
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  extension:
    needs: npm
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package once so retries do not rebuild. Both marketplaces' publish
      # APIs are flaky (v0.1.1 hit a 180s "Request timeout: /_apis/gallery"
      # from vsce on a GitHub-hosted runner, not just from a home network).
      # Publish each store independently so a Marketplace timeout does not
      # skip Open VSX. --skip-duplicate covers a "timed out" request that
      # actually succeeded server-side.
      - name: Package VSIX
        working-directory: editors/vscode
        run: pnpm exec vsce package --out /tmp/8bitscript.vsix
      - name: Publish to Visual Studio Marketplace
        id: vsce
        if: ${{ env.VSCE_PAT != '' }}
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            node scripts/publish-marketplace.mjs /tmp/8bitscript.vsix && exit 0
            [ "$attempt" = 3 ] && exit 1
            echo "Marketplace publish failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
      - name: Publish to Open VSX
        id: ovsx
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: editors/vscode
        run: |
          for attempt in 1 2 3; do
            pnpm exec ovsx publish /tmp/8bitscript.vsix -p "$OVSX_PAT" --skip-duplicate && exit 0
            [ "$attempt" = 3 ] && exit 1
            echo "ovsx publish failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
      - name: Fail if a marketplace publish failed
        if: always()
        env:
          VSCE_OUTCOME: ${{ steps.vsce.outcome }}
          OVSX_OUTCOME: ${{ steps.ovsx.outcome }}
        run: |
          failed=0
          if [ -n "$VSCE_PAT" ] && [ "$VSCE_OUTCOME" != "success" ]; then
            echo "Visual Studio Marketplace publish did not succeed ($VSCE_OUTCOME)"
            failed=1
          fi
          if [ -n "$OVSX_PAT" ] && [ "$OVSX_OUTCOME" != "success" ]; then
            echo "Open VSX publish did not succeed ($OVSX_OUTCOME)"
            failed=1
          fi
          exit "$failed"

  docs:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build

  github-release:
    needs: [npm, extension, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - id: ver
        run: echo "tag=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Extract this version's changelog entry
        run: |
          version="${TAG#v}"
          awk -v ver="## $version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' packages/cli/CHANGELOG.md > /tmp/release-notes.md
        env:
          TAG: ${{ steps.ver.outputs.tag }}
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
