# Every target is built by 8BitScript's own backends; no external SDK is installed.
name: Compile 8BitScript program

on:
  workflow_call:
    inputs:
      targets:
        description: Comma-separated 8bs build targets (vic20,c64,web,…).
        type: string
        required: true
      cli-version:
        description: '@8bitscript/cli version to install if the project has none.'
        type: string
        default: '0.1.0'
      attach-release:
        description: Upload dist/* to the GitHub Release that triggered this run.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install project
        run: pnpm install --frozen-lockfile
      - name: Ensure 8bs CLI
        run: |
          if [ ! -x node_modules/.bin/8bs ]; then
            pnpm add -D "@8bitscript/cli@${{ inputs.cli-version }}"
          fi
      - name: Build
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${{ inputs.targets }}"
          for raw in "${TARGETS[@]}"; do
            t="$(echo "$raw" | xargs)"
            [ -n "$t" ] || continue
            pnpm exec 8bs build --target "$t"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: 8bs-dist
          path: dist/**
      - name: Attach to GitHub Release
        if: inputs.attach-release && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(dist/**/*)
          upload=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then upload+=("$f"); fi
          done
          if [ ${#upload[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${upload[@]}" --clobber
          fi
