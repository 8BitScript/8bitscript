# Every target is built by 8BitScript's own backends; no external SDK is installed.
name: Compile 8BitScript program

on:
  workflow_call:
    inputs:
      targets:
        description: >-
          Comma-separated 8bs build targets (vic20,c64,web,…), each
          optionally @profile and :option=value,... on top (pet@2001:ram=4).
          Leave empty to build every artifact the project's own
          8bitscript.config.ts declares for a release instead (8bs build
          --release) — the config is then the one place the release matrix
          lives, not duplicated here.
        type: string
        required: false
        default: ''
      cli-version:
        description: '@8bitscript/cli version to install if the project has none.'
        type: string
        default: '0.1.0'
      attach-release:
        description: >-
          Upload dist/* to the GitHub Release this run is for — the one
          that triggered it (a `release` event), or the tag it was pushed
          or dispatched against otherwise. Either way the release must
          already exist; this step only uploads to it.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: Install project
        run: pnpm install --frozen-lockfile
      - name: Ensure 8bs CLI
        run: |
          if [ ! -x node_modules/.bin/8bs ]; then
            pnpm add -D "@8bitscript/cli@${{ inputs.cli-version }}"
          fi
      - name: Build
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.targets }}" ]; then
            pnpm exec 8bs build --release
            exit 0
          fi
          IFS=',' read -ra TARGETS <<< "${{ inputs.targets }}"
          for raw in "${TARGETS[@]}"; do
            entry="$(echo "$raw" | xargs)"
            [ -n "$entry" ] || continue
            # target[@profile][:hardware=opts,...] — @/: split it apart; a
            # plain "pet" (no @, no :) is just --target pet, same as always.
            target="${entry%%[@:]*}"
            args=(--target "$target")
            rest="${entry#"$target"}"
            if [[ "$rest" == @* ]]; then
              rest="${rest#@}"
              profile="${rest%%:*}"
              args+=(--profile "$profile")
              rest="${rest#"$profile"}"
            fi
            if [[ "$rest" == :* ]]; then
              args+=(--hardware "${rest#:}")
            fi
            pnpm exec 8bs build "${args[@]}"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: 8bs-dist
          path: dist/**
      - name: Attach to GitHub Release
        if: inputs.attach-release && (github.event_name == 'release' || github.ref_type == 'tag')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # What someone downloading a release actually wants is one file
          # per thing they can run. `dist/**/*` was not that: it flattened
          # the web bundle's own internals into loose assets beside the
          # machine artifacts, so a release listed index.html, worker.js,
          # _headers, and a program.wasm that was a byte-for-byte copy of
          # the main.wasm already listed above it.
          #
          # So: the machine artifacts (dist/*.prg, .xex, .nes, …) upload as
          # themselves, and the web bundle uploads as the single archive it
          # has to be unpacked from to work at all — index.html, worker.js,
          # program.wasm and the COOP/COEP _headers file are one deployable
          # unit, useless apart. The loose dist/*.wasm is left out of the
          # listing for the same reason: it is already inside the bundle,
          # and on its own it has no runtime to load it.
          upload=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.wasm) continue ;;
            esac
            upload+=("$f")
          done
          if [ -d dist/web ]; then
            (cd dist && zip -qr web-bundle.zip web)
            upload+=(dist/web-bundle.zip)
          fi
          if [ ${#upload[@]} -gt 0 ]; then
            printf 'uploading:\n'
            printf '  %s\n' "${upload[@]}"
            gh release upload "$TAG" "${upload[@]}" --clobber
          fi
