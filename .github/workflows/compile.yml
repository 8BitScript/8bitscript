name: Compile 8BitScript program

on:
  workflow_call:
    inputs:
      targets:
        description: Comma-separated 8bs build targets (vic20,c64,web,…).
        type: string
        required: true
      cli-version:
        description: '@8bitscript/cli version to install if the project has none.'
        type: string
        default: '0.1.0'
      attach-release:
        description: Upload dist/* to the GitHub Release that triggered this run.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install project
        run: pnpm install --frozen-lockfile
      - name: Ensure 8bs CLI
        run: |
          if [ ! -x node_modules/.bin/8bs ]; then
            pnpm add -D "@8bitscript/cli@${{ inputs.cli-version }}"
          fi
      - name: Cache LLVM-MOS SDK
        if: ${{ inputs.targets != 'web' }}
        id: llvm-mos
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mos
          key: llvm-mos-linux
      - name: Install LLVM-MOS SDK
        if: ${{ inputs.targets != 'web' && steps.llvm-mos.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          curl -sL https://github.com/llvm-mos/llvm-mos-sdk/releases/latest/download/llvm-mos-linux.tar.xz -o "$RUNNER_TEMP/llvm-mos.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mos"
          tar -xJf "$RUNNER_TEMP/llvm-mos.tar.xz" -C "$RUNNER_TEMP/llvm-mos" --strip-components=1
      - name: Export LLVM_MOS_HOME
        if: ${{ inputs.targets != 'web' }}
        run: echo "LLVM_MOS_HOME=$RUNNER_TEMP/llvm-mos" >> "$GITHUB_ENV"
      - name: Build
        env:
          LLVM_MOS_HOME: ${{ env.LLVM_MOS_HOME }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TARGETS <<< "${{ inputs.targets }}"
          for raw in "${TARGETS[@]}"; do
            t="$(echo "$raw" | xargs)"
            [ -n "$t" ] || continue
            if [ "$t" != "web" ] && [ -z "${LLVM_MOS_HOME:-}" ]; then
              echo "LLVM_MOS_HOME is not set; needed to build $t"
              exit 1
            fi
            pnpm exec 8bs build --target "$t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: 8bs-dist
          path: dist/**
      - name: Attach to GitHub Release
        if: inputs.attach-release && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(dist/**/*)
          upload=()
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then upload+=("$f"); fi
          done
          if [ ${#upload[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${upload[@]}" --clobber
          fi
