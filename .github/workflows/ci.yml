name: CI

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-llvm-mos
      - run: pnpm run test:ci

  # Skipped until SONAR_TOKEN is set on the repo (Settings → Secrets and
  # variables → Actions) and the 8bitscript_8bitscript project exists on
  # SonarCloud with Automatic Analysis off (Administration → Analysis
  # Method) — otherwise every PR would go red for a secret nobody added yet.
  #
  # `secrets` isn't a recognized context in a job-level `if:` (only step
  # contexts get it), so the gate lives in a step that sets an output, and
  # every later step checks that output instead.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for SONAR_TOKEN
        id: sonar_check
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@v4
        if: steps.sonar_check.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.sonar_check.outputs.enabled == 'true'
      - uses: ./.github/actions/setup-llvm-mos
        if: steps.sonar_check.outputs.enabled == 'true'
      - name: Test with coverage
        if: steps.sonar_check.outputs.enabled == 'true'
        run: pnpm run test:coverage
      - name: SonarQube Scan
        if: steps.sonar_check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
