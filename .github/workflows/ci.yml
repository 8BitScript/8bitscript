name: CI

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run test:ci

  # Fails the pull request when packages/ or editors/ changed and no
  # .changeset/*.md came with them. The version bot only opens a release
  # for changesets that actually merged. Docs and CI do not need one.
  # changeset-release/* is the Version Packages pull request, which
  # consumes changesets rather than adding one. The job always reports,
  # including on that pull request, so branch protection can require the
  # check without trapping the release.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a changeset when a published package changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | node scripts/require-changeset.mjs

  # Skipped until SONAR_TOKEN is set on the repo (Settings → Secrets and
  # variables → Actions). The Cloud project is 8BitScript_8bitscript; keep
  # Automatic Analysis off (Administration → Analysis Method) or the CI
  # scanner fights it — otherwise every PR would go red for a secret
  # nobody added yet.
  #
  # `secrets` isn't a recognized context in a job-level `if:` (only step
  # contexts get it), so the gate lives in a step that sets an output, and
  # every later step checks that output instead.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for SONAR_TOKEN
        id: sonar_check
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@v4
        if: steps.sonar_check.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.sonar_check.outputs.enabled == 'true'
      - name: Test with coverage
        if: steps.sonar_check.outputs.enabled == 'true'
        run: pnpm run test:coverage
      - name: SonarQube Scan
        if: steps.sonar_check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
