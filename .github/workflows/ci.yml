name: CI

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm run test:ci

  # The Rust port's oracle. The corpus is dumped twice in parallel jobs, the
  # second time from a copy of the checkout at another path, and the compare
  # job requires the two trees to be identical. Rust fmt, clippy and tests are
  # not run here.
  oracle-dump:
    name: Oracle dump ${{ matrix.where }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        where: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dump the corpus
        run: |
          if [ "${{ matrix.where }}" = b ]; then
            cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/copy"
            cd "$RUNNER_TEMP/copy"
          fi
          tap=()
          if [ "${{ matrix.where }}" = a ]; then
            tap=(--front-tap "$RUNNER_TEMP/front-tap")
          fi
          node scripts/oracle/corpus.mjs --dump --out "$RUNNER_TEMP/dump" "${tap[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oracle-dump-${{ matrix.where }}
          path: ${{ runner.temp }}/dump
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.where == 'a'
        with:
          name: front-tap-a
          path: ${{ runner.temp }}/front-tap
          include-hidden-files: true
          retention-days: 1
          compression-level: 1

  oracle:
    name: Oracle
    needs: oracle-dump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: oracle-dump-*
          path: ${{ runner.temp }}/dumps
      - name: The two dumps are identical
        run: cargo xtask compare "$RUNNER_TEMP/dumps/oracle-dump-a" "$RUNNER_TEMP/dumps/oracle-dump-b"

  # The Rust front end against the JS oracle: front-dump rebuilds the front
  # end's stage dumps from dump a and its front tap, and compare checks them
  # against dump a. Any ERROR line fails the job. The log carries the summary
  # and the first ERROR lines; the full report is in compare.txt.
  rust-compare:
    name: rust-compare
    needs: oracle-dump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oracle-dump-a
          path: ${{ runner.temp }}/dump-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: front-tap-a
          path: ${{ runner.temp }}/front-tap
      - name: Clone the pinned games
        run: |
          mkdir "$RUNNER_TEMP/games"
          jq -r '.games[] | [.name, .repo, .sha] | @tsv' oracle/corpus.json | while IFS=$'\t' read -r name repo sha; do
            git init -q "$RUNNER_TEMP/games/$name"
            git -C "$RUNNER_TEMP/games/$name" fetch -q --depth 1 "https://github.com/$repo.git" "$sha"
            git -C "$RUNNER_TEMP/games/$name" checkout -q --detach FETCH_HEAD
          done
      - name: Dump the Rust front end
        run: |
          games=()
          for dir in "$RUNNER_TEMP"/games/*; do
            games+=(--game "$(basename "$dir")=$dir")
          done
          cargo xtask front-dump "$RUNNER_TEMP/rust" --toolchain "$GITHUB_WORKSPACE" "${games[@]}" --builds "$RUNNER_TEMP/front-tap" --release-of "$RUNNER_TEMP/dump-a" 2>&1 | tail -n 40
          exit "${PIPESTATUS[0]}"
      - name: Compare with the JS dump
        run: |
          status=0
          cargo xtask compare "$RUNNER_TEMP/dump-a" "$RUNNER_TEMP/rust" --stages tokens,ast,module-ir,diagnostics --divergences oracle/divergences.toml > "$RUNNER_TEMP/compare.txt" || status=$?
          grep -m 40 ERROR "$RUNNER_TEMP/compare.txt" || true
          tail -n 1 "$RUNNER_TEMP/compare.txt"
          exit "$status"

  # Fails the pull request when packages/ or editors/ changed and no
  # .changeset/*.md came with them. The version bot only opens a release
  # for changesets that actually merged. Docs and CI do not need one.
  # changeset-release/* is the Version Packages pull request, which
  # consumes changesets rather than adding one. The job always reports,
  # including on that pull request, so branch protection can require the
  # check without trapping the release.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a changeset when a published package changes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | node scripts/require-changeset.mjs

  # Skipped until SONAR_TOKEN is set on the repo (Settings → Secrets and
  # variables → Actions). The Cloud project is 8BitScript_8bitscript; keep
  # Automatic Analysis off (Administration → Analysis Method) or the CI
  # scanner fights it — otherwise every PR would go red for a secret
  # nobody added yet.
  #
  # `secrets` isn't a recognized context in a job-level `if:` (only step
  # contexts get it), so the gate lives in a step that sets an output, and
  # every later step checks that output instead.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for SONAR_TOKEN
        id: sonar_check
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@v4
        if: steps.sonar_check.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.sonar_check.outputs.enabled == 'true'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.sonar_check.outputs.enabled == 'true'
      - name: Test with coverage
        if: steps.sonar_check.outputs.enabled == 'true'
        run: pnpm run test:coverage
      - name: SonarQube Scan
        if: steps.sonar_check.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
