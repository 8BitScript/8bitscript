name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'wrangler.jsonc'
      - 'docs/assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
